name: Verify document monitor
on:
  pull_request:
    paths:
      - '*.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: python -m py_compile scrape.py monitor_io.py
      - run: python -m unittest discover -s tests -v
        env:
          RUN_BROWSER_TESTS: 'true'
